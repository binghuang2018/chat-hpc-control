name: Offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.8
      - run: uv pip install --system --require-hashes -r constraints/core-dev.txt
      - run: uv pip install --system --no-deps -e . -e examples/plugins/demo-engine
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y task-spooler
      - run: python -m pytest tests -m "not qc_live and not provider_live and not github_live" -ra
  optional-sdks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.8
      - run: uv pip install --system --require-hashes -r constraints/tested.txt
      - run: uv pip install --system --no-deps -e .
      - run: python -m pytest tests/clients tests/transports/test_mcp.py tests/publishers -m "not qc_live and not provider_live and not github_live" -ra
      - run: |
          python scripts/check_optional_sdk.py openai
          python scripts/check_optional_sdk.py anthropic
          python scripts/check_optional_sdk.py gemini
