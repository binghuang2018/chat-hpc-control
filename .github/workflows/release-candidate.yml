name: Local-style candidate build (no package publication)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.8
      - run: uv pip install --system --require-hashes -r constraints/core-dev.txt
      - run: uv pip install --system --no-deps -e . -e examples/plugins/demo-engine
      - run: sudo apt-get update && sudo apt-get install -y task-spooler
      - run: python -m pytest tests -m "not qc_live and not provider_live and not github_live" -ra
      - run: |
          python -m build --no-isolation
          python -m build --wheel --no-isolation --outdir dist examples/plugins/demo-engine
          python -m twine check --strict dist/*
          cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-hpc-control-local-candidate
          path: dist/
          retention-days: 14
