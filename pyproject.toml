[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "chat-hpc-control"
version = "0.1.0"
description = "Provider-neutral, reproducible control of native QC calculations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: POSIX :: Linux"]
dependencies = ["jsonschema>=4.26.0,<5"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build==1.6.1", "hatchling==1.32.4", "twine>=6.2,<7"]
github = ["httpx>=0.28.1,<0.29"]
mcp = ["mcp>=2.3,<3"]
openai = ["openai>=3.35.1,<4"]
anthropic = ["anthropic>=1.17,<2"]
gemini = ["google-genai>=2.32,<3"]

[project.scripts]
chat-hpc-control = "chat_hpc_control.cli:main"

[project.entry-points."chat_hpc_control.executors"]
local = "chat_hpc_control.executors.local:LocalExecutor"
task-spooler = "chat_hpc_control.executors.task_spooler:TaskSpoolerExecutor"

[project.entry-points."chat_hpc_control.engines"]
pyscf = "chat_hpc_control.engines.pyscf:create_plugin"
orca = "chat_hpc_control.engines.orca:create_plugin"
molpro = "chat_hpc_control.engines.molpro:create_plugin"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/chat_hpc_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -ra"
markers = [
  "linux: requires a Linux execution host",
  "task_spooler: requires a private Task Spooler instance",
  "qc_live: explicitly authorized native QC execution",
  "provider_live: explicitly authorized real model API",
  "github_live: explicitly authorized external GitHub integration",
]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
exclude = ["/.superpowers/", "/.venv/", "/.worktrees/", "/runtime/", "**/__pycache__/", "**/*.pyc"]
include = ["/src/", "/tests/", "/examples/", "/docs/", "/tools/", "/scripts/", "/constraints/", "/.github/", "/action.yml", "/pyproject.toml", "/README*", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md"]
