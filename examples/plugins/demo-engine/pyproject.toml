[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "chat-hpc-demo-engine"
version = "0.1.0"
description = "Synthetic pipeline demonstration; no scientific computation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = ["chat-hpc-control==0.1.0"]

[project.entry-points."chat_hpc_control.engines"]
demo = "chat_hpc_demo.plugin:create_plugin"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/chat_hpc_demo"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
